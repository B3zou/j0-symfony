# L'interface Swagger UI (même adresse que celle d'API Platform, que vous verrez demain)
app.swagger_ui:
    path: /api
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }

# La spécification OpenAPI brute, en JSON (c'est elle que Swagger UI affiche)
app.swagger:
    path: /api/docs.json
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger }
